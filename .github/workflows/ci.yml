name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: bash tests/validate-structure.sh

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
